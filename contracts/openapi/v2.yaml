openapi: 3.0.3
info:
  title: Motor Antifraude — API v2
  version: "2.0.0"
  description: >
    Explicabilidade para consumidores autorizados. Requer autenticação e
    escopos. Não substitui a v1. CPF em claro é proibido.
servers:
  - url: /v2
paths:
  /score:
    post:
      operationId: scoreTransactionV2
      summary: Decisão com envelope de explicabilidade
      security:
        - serviceAuth:
            - score:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./v1.yaml#/components/schemas/ScoreRequest"
      responses:
        "200":
          description: Decisão explicável
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreResponseV2"
        "401":
          description: Não autenticado
        "403":
          description: Sem escopo
        "400":
          description: Payload inválido
components:
  securitySchemes:
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ScoreResponseV2:
      type: object
      additionalProperties: false
      required:
        - score
        - decision
        - signals
        - reason_codes
        - correlation_id
        - layers_executed
        - layers_skipped
        - terminated_by
        - model_versions
      properties:
        score:
          type: number
          minimum: 0
          maximum: 1
        decision:
          type: string
          enum: [approve, challenge, deny]
        signals:
          type: array
          items:
            type: string
        features:
          type: object
          additionalProperties: true
          description: Presente apenas com escopo explain:features. Valores minimizados.
        feature_weights:
          type: object
          additionalProperties:
            type: number
          description: Presente apenas com escopo explain:weights.
        reason_codes:
          type: array
          items:
            type: string
        model_versions:
          type: object
          additionalProperties: false
          properties:
            hbos:
              type: string
            xgboost:
              type: string
            policy:
              type: string
        layers_executed:
          type: array
          items:
            type: string
        layers_skipped:
          type: array
          items:
            type: string
        terminated_by:
          type: string
        correlation_id:
          type: string
        subject_id:
          type: string
          description: Token mascarado; nunca CPF.
