openapi: 3.0.3
info:
  title: Motor de Score Antifraude
  version: 1.0.0
  description: >-
    Contrato do microservico FastAPI de score antifraude.

    AS-IS: POST /api/v1/score-transaction devolve somente decision_final.

    TO-BE: POST /api/v2/score-transaction adiciona explicabilidade para consumidores
    autorizados, sob autenticacao, autorizacao por perfil e mascaramento.

    O orquestrador de challenge nao consome estas APIs: recebe o evento interno
    fraud.challenge.created.

    A quantidade de features nao e parte deste contrato enquanto
    contracts/features/registry.json estiver unreconciled.

servers:
  - url: https://antifraude.internal
    description: Ambiente interno

tags:
  - name: v1
    description: Contrato legado, retrocompativel. Nao evolui.
  - name: v2
    description: Contrato com explicabilidade, restrito a perfis autorizados.

paths:
  /api/v1/score-transaction:
    post:
      tags: [v1]
      operationId: scoreTransactionV1
      summary: Avalia uma transacao e retorna apenas a decisao final
      description: >-
        Contrato AS-IS do briefing. Mantido estavel para retrocompatibilidade.
        Score, sinais, features e pesos permanecem em logs e no evento interno.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreRequest'
      responses:
        '200':
          description: Decisao final da transacao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreResponseV1'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/v2/score-transaction:
    post:
      tags: [v2]
      operationId: scoreTransactionV2
      summary: Avalia uma transacao e retorna decisao com explicabilidade
      description: >-
        Requer escopo antifraude.score.explain. O nivel de detalhe depende do perfil.
        Nao faz parte do fast path dos autorizadores da v1.
      security:
        - bearerAuth: [antifraude.score.explain]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreRequest'
      responses:
        '200':
          description: Decisao com explicabilidade, filtrada pelo perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreResponseV2'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: false
      description: Reenvio com a mesma chave retorna a decisao original, sem reavaliacao.
      schema:
        type: string
        minLength: 1

  schemas:
    ScoreRequest:
      type: object
      required: [transaction_id, subject_token, amount, currency, channel, occurred_at]
      additionalProperties: false
      description: >-
        TO-BE de entrada. A implementacao AS-IS valida CPF 11 e CNPJ 14 no payload;
        este contrato nao aceita campo cpf (LGPD). Usar subject_token.
      properties:
        transaction_id:
          type: string
          minLength: 1
        subject_token:
          type: string
          minLength: 1
          description: Identificador interno ou CPF tokenizado. CPF em claro nao e aceito.
        amount:
          type: number
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        channel:
          type: string
        product:
          type: string
        transaction_type:
          type: string
        installments:
          type: integer
          minimum: 0
        occurred_at:
          type: string
          format: date-time
        merchant:
          $ref: '#/components/schemas/Merchant'
        device:
          $ref: '#/components/schemas/Device'
        geo:
          $ref: '#/components/schemas/Geo'

    Merchant:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        mcc:
          type: string

    Device:
      type: object
      additionalProperties: false
      properties:
        fingerprint_token:
          type: string
        ip_hash:
          type: string

    Geo:
      type: object
      additionalProperties: false
      properties:
        country:
          type: string
        region:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        precision:
          type: string

    Decision:
      type: string
      enum: [approve, challenge, deny]

    ScoreResponseV1:
      type: object
      required: [decision_final]
      additionalProperties: false
      properties:
        decision_final:
          $ref: '#/components/schemas/Decision'

    ScoreResponseV2:
      type: object
      required: [decision, score, reason_codes]
      additionalProperties: false
      properties:
        decision:
          $ref: '#/components/schemas/Decision'
        decision_final:
          allOf:
            - $ref: '#/components/schemas/Decision'
          description: Alias de decision para migracao da v1.
        score:
          type: number
          description: Score consolidado da media ponderada.
        reason_codes:
          type: array
          items:
            type: string
        signals:
          type: array
          items:
            type: string
        features:
          type: object
          additionalProperties: true
        feature_weights:
          type: object
          additionalProperties:
            type: number
        model_versions:
          $ref: '#/components/schemas/ModelVersions'
        cohort:
          type: string
          description: Coorte de cold start, quando aplicavel.

    ModelVersions:
      type: object
      additionalProperties: false
      properties:
        hbos:
          type: string
          nullable: true
        xgb:
          type: string
          nullable: true

    Error:
      type: object
      required: [reason_code, message]
      additionalProperties: false
      properties:
        reason_code:
          type: string
        message:
          type: string
        correlation_id:
          type: string

  responses:
    ValidationError:
      description: Payload invalido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Credencial ausente ou invalida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Perfil sem autorizacao para o nivel de explicabilidade.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Payload sintaticamente valido, semanticamente inconsistente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Dependencia critica indisponivel. Segue a escada de degradacao.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
