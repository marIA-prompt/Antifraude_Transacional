[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antifraud-policy-simulator"
version = "0.1.0"
description = "Simulador da política TO-BE do motor antifraude (não é o serviço de produção)."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
antifraud = ["policy.default.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
